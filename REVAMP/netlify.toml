[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# The functions import shared/ (outside the functions directory); esbuild
# bundles those relative imports into each function.
[functions]
  node_bundler = "esbuild"

[dev]
  command    = "npm run dev"
  targetPort = 5173
  port       = 8888
  framework  = "vite"
