<!DOCTYPE html>
<html lang="hr"><head><meta charset="utf-8"><title>Brec Destroyer // animirani roboti</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#eee;font-family:"DM Mono",ui-monospace,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px;gap:8px}
h1{font-size:14px;letter-spacing:.25em;text-transform:uppercase;color:#c8f560;font-weight:500}
.sub{font-size:11px;letter-spacing:.12em;color:#777;margin-bottom:34px}
.grid{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start;width:100%;max-width:1100px}
.card{border:1px solid rgba(255,255,255,.08);background:#0d0d0d;padding:0;overflow:hidden;display:flex;flex-direction:column}
.card svg{display:block;width:100%;height:auto}
.fight{flex:1 1 520px;max-width:560px}
.solo{flex:0 0 240px}
.cap{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#888;padding:11px 14px;border-top:1px solid rgba(255,255,255,.08)}
.cap b{color:#c8f560;font-weight:500}
footer{margin-top:34px;font-size:10px;letter-spacing:.1em;color:#555}
</style></head>
