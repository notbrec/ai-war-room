<svg xmlns="http://www.w3.org/2000/svg" width="416" height="416" viewBox="0 0 26 26" shape-rendering="crispEdges">
<style>
.r2b{animation:r2b 1.5s ease-in-out infinite alternate}
.r2l{transform-box:fill-box;transform-origin:center bottom;animation:r2l 1.1s ease-in-out infinite alternate}
.r2r{transform-box:fill-box;transform-origin:center bottom;animation:r2r 1.25s ease-in-out infinite alternate}
.r2k{opacity:0;animation:r2k 3.8s ease-in-out infinite}
@keyframes r2b{from{transform:translateY(0)}to{transform:translateY(-.5px)}}
@keyframes r2l{from{transform:rotate(7deg)}to{transform:rotate(-4deg)}}
@keyframes r2r{from{transform:rotate(-7deg)}to{transform:rotate(4deg)}}
@keyframes r2k{0%,91%{opacity:0}94%{opacity:1}97%,100%{opacity:0}}
</style>
<rect width="26" height="26" fill="#4d676f"/>
<g transform="translate(3,5)" fill="#d87456">
 <g class="r2b">
  <g class="r2l"><rect x="5" y="0" width="2" height="3"/></g>
  <g class="r2r"><rect x="13" y="0" width="2" height="3"/></g>
  <g><rect x="4" y="3" width="12" height="3"/><rect x="3" y="4" width="1" height="9"/><rect x="16" y="4" width="1" height="9"/><rect x="4" y="6" width="2" height="8"/><rect x="8" y="6" width="4" height="4"/><rect x="14" y="6" width="2" height="8"/><rect x="6" y="8" width="2" height="8"/><rect x="12" y="8" width="2" height="8"/><rect x="0" y="9" width="2" height="3"/><rect x="18" y="9" width="2" height="3"/><rect x="2" y="10" width="1" height="1"/><rect x="17" y="10" width="1" height="1"/><rect x="8" y="11" width="4" height="3"/><rect x="5" y="15" width="1" height="1"/><rect x="14" y="15" width="1" height="1"/></g>
  <g class="r2k"><rect x="6" y="6" width="2" height="2"/><rect x="12" y="6" width="2" height="2"/></g>
 </g>
</g>
</svg>