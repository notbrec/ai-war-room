<svg xmlns="http://www.w3.org/2000/svg" width="448" height="448" viewBox="0 0 28 28" shape-rendering="crispEdges">
<style>
.r1b{animation:r1b 1.6s ease-in-out infinite alternate}
.r1a{transform-box:fill-box;transform-origin:center bottom;animation:r1a 1.3s ease-in-out infinite alternate}
.r1k{opacity:0;animation:r1k 3.4s ease-in-out infinite}
@keyframes r1b{from{transform:translateY(0)}to{transform:translateY(-.5px)}}
@keyframes r1a{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes r1k{0%,90%{opacity:0}93%{opacity:1}96%,100%{opacity:0}}
</style>
<rect width="28" height="28" fill="#4d676f"/>
